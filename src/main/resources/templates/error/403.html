<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 - Không có quyền</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; }
        .error-card { background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.08); }
    </style>
</head>
<body>
    <div class="error-card">
        <div style="font-size:4rem;margin-bottom:16px;">🚫</div>
        <h1 style="font-size:1.4rem;font-weight:700;color:#1e293b">403 - Không có quyền truy cập</h1>
        <p style="color:#64748b;font-size:.9rem">Bạn không có quyền xem trang này.</p>
        <a href="javascript:history.back()" class="btn mt-3"
           style="background:#6366f1;color:#fff;border-radius:10px;padding:10px 24px;">
            <i class="bi bi-arrow-left me-2"></i>Quay lại
        </a>
    </div>
</body>
</html>
