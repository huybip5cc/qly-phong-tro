<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Chi tiết bồi thường</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/landlord/boi-thuong}" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;"><i class="bi bi-arrow-left"></i></a>
        <h1 class="page-title mb-0">Bồi thường thiệt hại #<span th:text="${boiThuong.id}"></span></h1>
    </div>

    <!-- Alert flash -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show alert-flash mb-3">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-3" style="max-width:850px;">
        <div class="col-md-8">
            <div class="card-box">
                <div class="card-box-hd">
                    <h5><i class="bi bi-shield-exclamation me-2" style="color:#6366f1"></i>Thông tin khoản bồi thường</h5>
                    <span class="badge"
                          th:classappend="${boiThuong.trangThai.name() == 'TRANG_THAI_0'} ? 'bg-chua-tt' :
                                         (${boiThuong.trangThai.name() == 'TRANG_THAI_1'} ? 'bg-cho-duyet' : 'bg-da-tt')"
                          th:text="${boiThuong.trangThaiLabel}"></span>
                </div>
                <div class="p-4">
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="text-muted" style="font-size:.77rem">Phòng</div>
                            <div class="fw-600" th:text="${'Phòng ' + boiThuong.soPhong}"></div>
                            <div class="text-muted" style="font-size:.8rem" th:text="${boiThuong.tenToaNha}"></div>
                        </div>
                        <div class="col-6">
                            <div class="text-muted" style="font-size:.77rem">Khách đại diện</div>
                            <div th:text="${boiThuong.tenKhachDaiDien ?: '—'}"></div>
                        </div>
                        <div class="col-6">
                            <div class="text-muted" style="font-size:.77rem">Nguồn phát hiện</div>
                            <span class="badge"
                                  th:classappend="${boiThuong.nguonPhatHien.name() == 'TRONG_LUC_O'} ? 'bg-primary' : 'bg-warning text-dark'"
                                  th:text="${boiThuong.nguonPhatHienLabel}"></span>
                        </div>
                        <div class="col-6">
                            <div class="text-muted" style="font-size:.77rem">Số tiền yêu cầu bồi thường</div>
                            <div class="fw-700 text-danger fs-5"
                                 th:text="${#numbers.formatDecimal(boiThuong.soTien,0,'COMMA',0,'POINT')} + ' đ'"></div>
                        </div>
                        <div class="col-12" th:if="${boiThuong.suCoId != null}">
                            <div class="text-muted" style="font-size:.77rem">Liên kết sự cố</div>
                            <div>
                                <a th:href="@{/landlord/su-co/{id}(id=${boiThuong.suCoId})}" class="text-decoration-none">
                                    <i class="bi bi-tools me-1"></i>Sự cố #<span th:text="${boiThuong.suCoId}"></span>:
                                    <span th:text="${boiThuong.moTaSuCo}"></span>
                                </a>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="text-muted" style="font-size:.77rem">Mô tả chi tiết</div>
                            <div class="p-2 mt-1 rounded" style="background:#f8fafc; font-size:.88rem;"
                                 th:text="${boiThuong.moTa}"></div>
                        </div>
                        <div class="col-12" th:if="${boiThuong.anhChuyenKhoan != null}">
                            <div class="text-muted mb-1" style="font-size:.77rem">Ảnh biên lai / chuyển khoản của khách</div>
                            <a th:href="@{${boiThuong.anhChuyenKhoan}}" target="_blank">
                                <img th:src="@{${boiThuong.anhChuyenKhoan}}" style="max-width:260px;border-radius:8px;border:1px solid #e2e8f0;">
                            </a>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="mt-4 pt-3 border-top d-flex gap-2">
                        <div th:if="${boiThuong.nguonPhatHien.name() == 'TRONG_LUC_O' and (boiThuong.trangThai.name() == 'TRANG_THAI_1' or boiThuong.trangThai.name() == 'TRANG_THAI_0')}">
                            <form th:action="@{/landlord/boi-thuong/{id}/xac-nhan(id=${boiThuong.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-success" style="border-radius:8px;"
                                        onclick="return confirm('Xác nhận khách đã nộp khoản tiền bồi thường này?')">
                                    <i class="bi bi-check-circle me-1"></i>Xác nhận đã nhận tiền
                                </button>
                            </form>
                        </div>
                        <div th:if="${boiThuong.trangThai.name() == 'TRANG_THAI_0'}">
                            <form th:action="@{/landlord/boi-thuong/{id}/xoa(id=${boiThuong.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-danger" style="border-radius:8px;"
                                        onclick="return confirm('Xóa yêu cầu bồi thường này?')">
                                    <i class="bi bi-trash me-1"></i>Xóa
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-box">
                <div class="card-box-hd"><h5>Thời gian & Hợp đồng</h5></div>
                <div class="p-3" style="font-size:.875rem;">
                    <div class="mb-2"><span class="text-muted">Ngày ghi nhận:</span> <span class="fw-500" th:text="${#temporals.format(boiThuong.ngayGhiNhan,'dd/MM/yyyy')}"></span></div>
                    <div>
                        <span class="text-muted">Hợp đồng:</span>
                        <a th:href="@{/landlord/hop-dong/{id}(id=${boiThuong.hopDongId})}" class="fw-500 text-decoration-none">
                            #<span th:text="${boiThuong.hopDongId}"></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
