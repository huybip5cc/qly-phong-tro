<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Chỉ số điện/nước</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0">Chỉ số Điện / Nước</h1>
        <a th:href="@{/landlord/chi-so/nhap}" class="btn btn-accent">
            <i class="bi bi-plus-circle me-1"></i>Nhập chỉ số
        </a>
    </div>

    <!-- Filter by phong -->
    <div class="card-box mb-3 p-3">
        <form method="get" th:action="@{/landlord/chi-so}" class="d-flex gap-2 align-items-end">
            <div>
                <label class="form-label mb-1" style="font-size:.8rem;color:#64748b;">Lọc theo phòng</label>
                <select name="phongId" class="form-select form-select-sm" style="min-width:220px;">
                    <option value="">-- Tất cả --</option>
                    <option th:each="p : ${danhSachPhong}"
                            th:value="${p.id}"
                            th:text="${p.tenToaNha + ' - Phòng ' + p.soPhong}"
                            th:selected="${phongFilter != null and phongFilter.id == p.id}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;">Lọc</button>
            <a th:href="@{/landlord/chi-so}" class="btn btn-sm btn-light" style="border-radius:8px;">Xóa lọc</a>
        </form>
    </div>

    <div class="card-box">
        <div class="card-box-hd">
            <h5><i class="bi bi-lightning-charge me-2" style="color:#6366f1"></i>Chỉ số đã nhập</h5>
            <small class="text-muted" th:text="${danhSach.size()} + ' bản ghi'"></small>
        </div>
        <div th:if="${danhSach.isEmpty()}" class="p-5 text-center text-muted">
            <i class="bi bi-lightning" style="font-size:3rem;opacity:.3"></i>
            <p class="mt-2">Chưa có chỉ số nào được nhập.</p>
        </div>
        <div class="table-responsive" th:if="${!danhSach.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>Phòng</th>
                    <th>Tháng</th>
                    <th>Điện (cũ → mới)</th>
                    <th>Nước (cũ → mới)</th>
                    <th>Trạng thái</th>
                    <th>Ngày nhập</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${danhSach}">
                    <td>
                        <strong th:text="${'Phòng ' + item.soPhong}"></strong>
                        <div class="text-muted" style="font-size:.76rem" th:text="${item.tenToaNha}"></div>
                    </td>
                    <td><strong th:text="${item.thangNam}"></strong></td>
                    <td>
                        <span class="text-muted" th:text="${item.chiSoDienCu}"></span>
                        <i class="bi bi-arrow-right mx-1 text-muted" style="font-size:.7rem"></i>
                        <span class="fw-600 text-warning" th:text="${item.chiSoDienMoi}"></span>
                        <small class="text-muted ms-1" th:text="'(' + ${item.chiSoDienMoi - item.chiSoDienCu} + ' số)'"></small>
                    </td>
                    <td>
                        <span class="text-muted" th:text="${item.chiSoNuocCu}"></span>
                        <i class="bi bi-arrow-right mx-1 text-muted" style="font-size:.7rem"></i>
                        <span class="fw-600 text-info" th:text="${item.chiSoNuocMoi}"></span>
                        <small class="text-muted ms-1" th:text="'(' + ${item.chiSoNuocMoi - item.chiSoNuocCu} + ' khối)'"></small>
                    </td>
                    <td>
                            <span class="badge"
                                  th:classappend="${item.trangThai != null and item.trangThai.name() == 'DA_CHOT'} ? 'bg-da-tt' :
                                                 (${item.trangThai != null and item.trangThai.name() == 'CAN_XAC_MINH'} ? 'bg-moi' : 'bg-chua-tt')"
                                  th:text="${item.trangThaiLabel}"></span>
                    </td>
                    <td th:text="${item.ngayBao != null ? #temporals.format(item.ngayBao,'dd/MM/yyyy') : '—'}"></td>
                    <td>
                        <div class="d-flex gap-1">
                            <form th:if="${item.trangThai != null and item.trangThai.name() != 'DA_CHOT'}"
                                  th:action="@{/landlord/chi-so/{id}/chot(id=${item.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-success" style="border-radius:7px;" title="Chốt chỉ số">
                                    <i class="bi bi-check-circle"></i>
                                </button>
                            </form>
                            <form th:if="${item.trangThai != null and item.trangThai.name() == 'DA_CHOT'}"
                                  th:action="@{/landlord/hoa-don/tao}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="hidden" name="phongId" th:value="${item.phongId}">
                                <input type="hidden" name="thangNam" th:value="${item.thangNam}">
                                <button type="submit" class="btn btn-sm btn-accent" style="border-radius:7px;" title="Tạo hóa đơn">
                                    <i class="bi bi-receipt"></i>
                                </button>
                            </form>
                            <form th:if="${item.trangThai != null and item.trangThai.name() != 'DA_CHOT'}"
                                  th:action="@{/landlord/chi-so/{id}/xoa(id=${item.id})}" method="post"
                                  onsubmit="return confirm('Xác nhận xóa chỉ số này?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" style="border-radius:7px;">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
