<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Hóa đơn</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0">Quản lý Hóa đơn</h1>
    </div>
    <div class="card-box">
        <div class="card-box-hd">
            <h5><i class="bi bi-receipt me-2" style="color:#6366f1"></i>Tất cả hóa đơn</h5>
            <small class="text-muted" th:text="${danhSach != null ? danhSach.size() : 0} + ' hóa đơn'"></small>
        </div>
        <div th:if="${danhSach == null or danhSach.isEmpty()}" class="p-5 text-center text-muted">
            <i class="bi bi-receipt" style="font-size:3rem;opacity:.3"></i>
            <p class="mt-2">Chưa có hóa đơn nào.</p>
        </div>
        <div class="table-responsive" th:if="${danhSach != null and !danhSach.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Phòng</th>
                    <th>Khách đại diện</th>
                    <th>Tháng</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, st : ${danhSach}">
                    <td th:text="${st.count}" class="text-muted"></td>
                    <td>
                        <strong th:text="${item.soPhong}"></strong>
                        <div class="text-muted" style="font-size:.76rem" th:text="${item.tenToaNha}"></div>
                    </td>
                    <td th:text="${item.tenKhachDaiDien ?: '—'}"></td>
                    <td th:text="${item.thangNam}"></td>
                    <td class="fw-600 text-success" th:text="${#numbers.formatDecimal(item.tongTien,0,'COMMA',0,'POINT')} + ' đ'"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${item.trangThai != null and item.trangThai.name() == 'CHUA_THANH_TOAN'} ? 'bg-chua-tt' :
                                                 (${item.trangThai != null and item.trangThai.name() == 'CHO_DUYET'} ? 'bg-cho-duyet' : 'bg-da-tt')"
                                  th:text="${item.trangThaiLabel}"></span>
                    </td>
                    <td class="d-flex gap-1">
                        <a th:href="@{/landlord/hoa-don/{id}(id=${item.id})}"
                           class="btn btn-sm btn-outline-primary" style="border-radius:7px;"><i class="bi bi-eye"></i></a>
                        <form th:if="${item.trangThai != null and item.trangThai.name() == 'CHO_DUYET'}"
                              th:action="@{/landlord/hoa-don/{id}/xac-nhan(id=${item.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-success" style="border-radius:7px;" title="Xác nhận thanh toán">
                                <i class="bi bi-check-circle"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
