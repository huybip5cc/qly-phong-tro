<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Ký Hợp đồng</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/landlord/hop-dong}" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;"><i class="bi bi-arrow-left"></i></a>
        <h1 class="page-title mb-0">Ký Hợp đồng mới</h1>
    </div>
    <div class="card-box" style="max-width:640px;">
        <div class="card-box-hd">
            <h5><i class="bi bi-file-earmark-text me-2" style="color:#6366f1"></i>Thông tin hợp đồng</h5>
        </div>
        <div class="p-4">
            <form th:action="@{/landlord/hop-dong/them}" th:object="${request}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label fw-500">Phòng <span class="text-danger">*</span></label>
                    <select th:field="*{phongId}" class="form-select"
                            th:classappend="${#fields.hasErrors('phongId')} ? 'is-invalid'">
                        <option value="">-- Chọn phòng (trống) --</option>
                        <option th:each="p : ${danhSachPhong}"
                                th:if="${p.trangThai != null and p.trangThai.name() == 'TRONG'}"
                                th:value="${p.id}"
                                th:text="${p.tenToaNha + ' - Phòng ' + p.soPhong + ' (' + #numbers.formatDecimal(p.giaThueTheoMacDinh,0,'COMMA',0,'POINT') + ' đ)'}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{phongId}"></div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-500">Ngày bắt đầu <span class="text-danger">*</span></label>
                        <input type="date" th:field="*{ngayBatDau}" class="form-control"
                               th:classappend="${#fields.hasErrors('ngayBatDau')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{ngayBatDau}"></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-500">Ngày kết thúc</label>
                        <input type="date" th:field="*{ngayKetThuc}" class="form-control">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-500">Tiền thuê/tháng (đ) <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{tienThue}" class="form-control"
                               th:classappend="${#fields.hasErrors('tienThue')} ? 'is-invalid'"
                               placeholder="VD: 3000000" min="0">
                        <div class="invalid-feedback" th:errors="*{tienThue}"></div>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-500">Tiền cọc (đ) <span class="text-danger">*</span></label>
                        <input type="number" th:field="*{tienCoc}" class="form-control"
                               th:classappend="${#fields.hasErrors('tienCoc')} ? 'is-invalid'"
                               placeholder="VD: 3000000" min="0">
                        <div class="invalid-feedback" th:errors="*{tienCoc}"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-500">Khách thuê đại diện <span class="text-danger">*</span></label>
                    <select th:field="*{khachThueId}" class="form-select"
                            th:classappend="${#fields.hasErrors('khachThueId')} ? 'is-invalid'">
                        <option value="">-- Chọn khách thuê --</option>
                        <option th:each="k : ${danhSachKhach}"
                                th:value="${k.id}"
                                th:text="${k.hoTen + ' (CCCD: ' + k.cccd + ')'}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{khachThueId}"></div>
                    <div class="form-text">
                        <a th:href="@{/landlord/khach-thue/them}" target="_blank">
                            <i class="bi bi-person-plus me-1"></i>Chưa có? Thêm khách mới
                        </a>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent"><i class="bi bi-check-circle me-1"></i>Ký hợp đồng</button>
                    <a th:href="@{/landlord/hop-dong}" class="btn btn-outline-secondary" style="border-radius:8px;">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
