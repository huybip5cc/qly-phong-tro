<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Hợp đồng</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0">Danh sách Hợp đồng</h1>
        <a th:href="@{/landlord/hop-dong/them}" class="btn btn-accent">
            <i class="bi bi-plus-circle me-1"></i>Ký hợp đồng mới
        </a>
    </div>
    <div class="card-box">
        <div class="card-box-hd">
            <h5><i class="bi bi-file-earmark-text me-2" style="color:#6366f1"></i>Hợp đồng</h5>
            <small class="text-muted" th:text="${danhSach.size()} + ' hợp đồng'"></small>
        </div>
        <div th:if="${danhSach.isEmpty()}" class="p-5 text-center text-muted">
            <i class="bi bi-file-earmark-x" style="font-size:3rem;opacity:.3"></i>
            <p class="mt-2">Chưa có hợp đồng nào.</p>
        </div>
        <div class="table-responsive" th:if="${!danhSach.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Phòng</th>
                    <th>Đại diện</th>
                    <th>Ngày bắt đầu</th>
                    <th>Tiền thuê</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, st : ${danhSach}">
                    <td th:text="${st.count}" class="text-muted"></td>
                    <td>
                        <strong th:text="${item.soPhong}"></strong>
                        <div class="text-muted" style="font-size:.76rem" th:text="${item.tenToaNha}"></div>
                    </td>
                    <td th:text="${item.daiDien != null ? item.daiDien.hoTen : '—'}"></td>
                    <td th:text="${#temporals.format(item.ngayBatDau, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#numbers.formatDecimal(item.tienThue, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${item.trangThai.name() == 'ACTIVE'} ? 'bg-active' :
                                                 (${item.trangThai.name() == 'KET_THUC_BINH_THUONG'} ? 'bg-cho-duyet' : 'bg-ngung')"
                                  th:text="${item.trangThaiLabel}"></span>
                    </td>
                    <td>
                        <a th:href="@{/landlord/hop-dong/{id}(id=${item.id})}"
                           class="btn btn-sm btn-outline-primary" style="border-radius:7px;">
                            <i class="bi bi-eye"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
