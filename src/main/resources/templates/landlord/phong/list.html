<!DOCTYPE html>
<!-- SỬA Ở ĐÂY 1: Bỏ th:replace="~{layout/base :: html-body}", chỉ giữ lại khai báo xmlns -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Phòng</title></head>
<body>

<!-- SỬA Ở ĐÂY 2: Đổi th:fragment="pageContent" thành th:fragment="content" để khớp với lệnh trong base.html -->
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0">Danh sách Phòng</h1>
        <a th:href="@{/landlord/phong/them}" class="btn btn-accent">
            <i class="bi bi-plus-circle me-1"></i>Thêm phòng
        </a>
    </div>

    <!-- Filter by toa nha -->
    <div class="card-box mb-3 p-3">
        <form method="get" th:action="@{/landlord/phong}" class="d-flex gap-2 align-items-end">
            <div>
                <label class="form-label mb-1" style="font-size:.8rem;color:#64748b;">Lọc theo tòa nhà</label>
                <select name="toaNhaId" class="form-select form-select-sm" style="min-width:200px;">
                    <option value="">-- Tất cả --</option>
                    <option th:each="tn : ${danhSachToaNha}"
                            th:value="${tn.id}"
                            th:text="${tn.tenToaNha}"
                            th:selected="${toaNhaFilter != null and toaNhaFilter.id == tn.id}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;">Lọc</button>
            <a th:href="@{/landlord/phong}" class="btn btn-sm btn-light" style="border-radius:8px;">Xóa lọc</a>
        </form>
    </div>

    <div class="card-box">
        <div class="card-box-hd">
            <h5><i class="bi bi-door-open me-2" style="color:#6366f1"></i>Phòng</h5>
            <small class="text-muted" th:text="${danhSach.size()} + ' phòng'"></small>
        </div>
        <div th:if="${danhSach.isEmpty()}" class="p-5 text-center text-muted">
            <i class="bi bi-door-closed" style="font-size:3rem;opacity:.3"></i>
            <p class="mt-2">Chưa có phòng nào. <a th:href="@{/landlord/phong/them}">Thêm ngay</a></p>
        </div>
        <div class="table-responsive" th:if="${!danhSach.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Số phòng</th>
                    <th>Tòa nhà</th>
                    <th>Diện tích</th>
                    <th>Giá thuê</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, st : ${danhSach}">
                    <td th:text="${st.count}" class="text-muted"></td>
                    <td><strong th:text="${'Phòng ' + item.soPhong}"></strong></td>
                    <td>
                        <a th:href="@{/landlord/phong(toaNhaId=${item.toaNhaId})}"
                           th:text="${item.tenToaNha}" class="text-decoration-none text-muted"></a>
                    </td>
                    <td th:text="${item.dienTich != null ? item.dienTich + ' m²' : '—'}"></td>
                    <td class="fw-500" th:text="${#numbers.formatDecimal(item.giaThueTheoMacDinh,0,'COMMA',0,'POINT')} + ' đ'"></td>
                    <td>
                            <span class="badge"
                                  th:classappend="${item.trangThai.name() == 'TRONG'} ? 'bg-trang' :
                                                 (${item.trangThai.name() == 'DANG_THUE'} ? 'bg-dang-thue' : 'bg-ngung')"
                                  th:text="${item.trangThaiLabel}"></span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{/landlord/phong/chi-tiet/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-secondary" style="border-radius:7px;" title="Chi tiết & Thiết bị">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/landlord/phong/sua/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-primary" style="border-radius:7px;"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/landlord/phong/xoa/{id}(id=${item.id})}" method="post"
                                  onsubmit="return confirm('Xác nhận xóa phòng này?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" style="border-radius:7px;"><i class="bi bi-trash"></i></button>
                            </form>
                            <a th:href="@{/landlord/chi-so(phongId=${item.id})}"
                               class="btn btn-sm btn-outline-secondary" style="border-radius:7px;" title="Chỉ số ĐN">
                                <i class="bi bi-lightning-charge"></i>
                            </a>
                        </div>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- SỬA Ở ĐÂY 3: Đóng thẻ </div> thay cho </th:block> -->
</div>
</body>
</html>
