<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0">Danh sách Tòa nhà</h1>
        <a th:href="@{/landlord/toa-nha/them}" class="btn btn-accent">
            <i class="bi bi-plus-circle me-1"></i>Thêm tòa nhà
        </a>
    </div>

    <div class="card-box">
        <div class="card-box-hd">
            <h5><i class="bi bi-building me-2" style="color:#6366f1"></i>Tòa nhà</h5>
            <small class="text-muted" th:text="${danhSach != null ? danhSach.size() : 0} + ' tòa nhà'">0 tòa nhà</small>
        </div>
        <div th:if="${danhSach == null or danhSach.isEmpty()}" class="p-5 text-center text-muted">
            <i class="bi bi-building" style="font-size:3rem; opacity:.3"></i>
            <p class="mt-2">Chưa có tòa nhà nào. <a th:href="@{/landlord/toa-nha/them}">Thêm ngay</a></p>
        </div>
        <table class="table" th:if="${danhSach != null and !danhSach.isEmpty()}">
            <thead>
            <tr>
                <th>#</th>
                <th>Tên tòa nhà</th>
                <th>Địa chỉ</th>
                <th>Số phòng</th>
                <th>Trạng thái</th>
                <th>Ngày tạo</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item, stat : ${danhSach}">
                <td th:text="${stat.count}" class="text-muted"></td>
                <td><strong th:text="${item.tenToaNha}"></strong></td>
                <td th:text="${item.diaChi ?: '—'}"></td>
                <td>
                    <span class="badge bg-light text-dark border" th:text="${item.soPhong} + ' phòng'"></span>
                </td>
                <td>
                        <span class="badge"
                              th:classappend="${item.trangThai != null and item.trangThai.name() == 'HOAT_DONG'} ? 'bg-active' : 'bg-ngung'"
                              th:text="${item.trangThaiLabel != null ? item.trangThaiLabel : item.trangThai}"></span>
                </td>
                <td th:text="${item.ngayTao != null ? #temporals.format(item.ngayTao, 'dd/MM/yyyy') : '—'}"></td>
                <td>
                    <div class="d-flex gap-1">
                        <a th:href="@{/landlord/toa-nha/sua/{id}(id=${item.id})}"
                           class="btn btn-sm btn-outline-primary" style="border-radius:7px;" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/landlord/toa-nha/xoa/{id}(id=${item.id})}" method="post"
                              onsubmit="return confirm('Xác nhận xóa tòa nhà này?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-danger" style="border-radius:7px;" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
