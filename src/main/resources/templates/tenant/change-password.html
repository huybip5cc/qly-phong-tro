<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Đổi mật khẩu</title></head>
<body>
<div th:fragment="content">
    <h1 class="page-title">Đổi mật khẩu</h1>
    <div class="card-box" style="max-width:520px;">
        <div class="card-box-hd">
            <h5><i class="bi bi-shield-lock me-2" style="color:#6366f1"></i>Bảo mật tài khoản</h5>
        </div>
        <div class="p-4">
            <p th:if="${#authentication.principal.mustChangePassword}"
               class="alert alert-warning alert-flash">
                Đây là lần đăng nhập đầu tiên. Vui lòng đổi mật khẩu tạm thời trước khi tiếp tục.
            </p>
            <form th:action="@{/tenant/change-password}" th:object="${request}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                    <input type="password" id="currentPassword" name="currentPassword" class="form-control"
                           autocomplete="current-password" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}"
                         th:errors="*{currentPassword}"></div>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control"
                           autocomplete="new-password" minlength="8" maxlength="72" required
                           aria-describedby="passwordRequirements">
                    <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}"></div>
                    <div id="passwordRequirements" class="form-text">
                        Tối thiểu 8 ký tự, có ít nhất một chữ số và một ký tự đặc biệt.
                    </div>
                </div>
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                           autocomplete="new-password" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-accent">
                    <i class="bi bi-check-circle me-1"></i>Lưu mật khẩu mới
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
