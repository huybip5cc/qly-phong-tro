<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f1f5f9; }
        .error-card { background: #fff; border-radius: 20px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.08); }
        .error-icon { font-size: 4rem; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; font-weight: 700; color: #1e293b; }
        p { color: #64748b; font-size: .9rem; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon" style="color:#6366f1">🔍</div>
        <h1 th:text="${errorTitle ?: '404 - Không tìm thấy'}">Không tìm thấy</h1>
        <p th:text="${errorMessage ?: 'Trang hoặc dữ liệu bạn tìm kiếm không tồn tại.'}">Không tìm thấy</p>
        <a href="javascript:history.back()" class="btn mt-3"
           style="background:#6366f1;color:#fff;border-radius:10px;padding:10px 24px;">
            <i class="bi bi-arrow-left me-2"></i>Quay lại
        </a>
    </div>
</body>
</html>
