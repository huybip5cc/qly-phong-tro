<!DOCTYPE html>
<!-- SỬA 1: Bỏ th:replace="~{layout/base :: html-body}" -->
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Khách thuê</title></head>
<body>

<!-- SỬA 2: Đổi sang <div th:fragment="content"> -->
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0">Danh sách Khách thuê</h1>
        <a th:href="@{/landlord/khach-thue/them}" class="btn btn-accent">
            <i class="bi bi-person-plus me-1"></i>Thêm khách thuê
        </a>
    </div>
    <div class="card-box">
        <div class="card-box-hd">
            <h5><i class="bi bi-people me-2" style="color:#6366f1"></i>Khách thuê</h5>
            <small class="text-muted" th:text="${danhSach.size()} + ' khách'"></small>
        </div>
        <div th:if="${danhSach.isEmpty()}" class="p-5 text-center text-muted">
            <i class="bi bi-people" style="font-size:3rem;opacity:.3"></i>
            <p class="mt-2">Chưa có khách thuê nào.</p>
        </div>
        <div class="table-responsive" th:if="${!danhSach.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Họ tên</th>
                    <th>CCCD</th>
                    <th>Số điện thoại</th>
                    <th>Ngày sinh</th>
                    <th>Tài khoản</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item, st : ${danhSach}">
                    <td th:text="${st.count}" class="text-muted"></td>
                    <td><strong th:text="${item.hoTen}"></strong></td>
                    <td><code th:text="${item.cccd}"></code></td>
                    <td th:text="${item.sdt ?: '—'}"></td>
                    <td th:text="${item.ngaySinh != null ? #temporals.format(item.ngaySinh,'dd/MM/yyyy') : '—'}"></td>
                    <td>
                            <span th:if="${item.username != null}"
                                  class="badge bg-active" th:text="${item.username}"></span>
                        <span th:if="${item.username == null}" class="text-muted" style="font-size:.8rem;">Chưa có</span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{/landlord/khach-thue/sua/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-primary" style="border-radius:7px;"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/landlord/khach-thue/xoa/{id}(id=${item.id})}" method="post"
                                  onsubmit="return confirm('Xác nhận xóa khách thuê này?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" style="border-radius:7px;"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <!-- SỬA 3: Đóng thẻ </div> -->
</div>
</body>
</html>
