<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Tạo tài khoản</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/landlord/nguoi-dung}" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;"><i class="bi bi-arrow-left"></i></a>
        <h1 class="page-title mb-0">Tạo Tài khoản</h1>
    </div>
    <div class="card-box" style="max-width:520px;">
        <div class="card-box-hd"><h5><i class="bi bi-person-plus me-2" style="color:#6366f1"></i>Thông tin tài khoản</h5></div>
        <div class="p-4">
            <form th:action="@{/landlord/nguoi-dung/them}" th:object="${request}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label for="username" class="form-label fw-500">Username <span class="text-danger">*</span></label>
                        <input type="text" id="username" th:field="*{username}" class="form-control"
                               th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" autocomplete="off">
                        <div class="invalid-feedback" th:errors="*{username}"></div>
                    </div>
                    <div class="col-6">
                        <label for="password" class="form-label fw-500">Mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" id="password" th:field="*{password}" class="form-control"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{password}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="hoTen" class="form-label fw-500">Họ tên <span class="text-danger">*</span></label>
                    <input type="text" id="hoTen" th:field="*{hoTen}" class="form-control"
                           th:classappend="${#fields.hasErrors('hoTen')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{hoTen}"></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label for="sdt" class="form-label fw-500">Số điện thoại</label>
                        <input type="text" id="sdt" th:field="*{sdt}" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="email" class="form-label fw-500">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-500">Vai trò <span class="text-danger">*</span></label>
                    <select th:field="*{vaiTro}" class="form-select" th:classappend="${#fields.hasErrors('vaiTro')} ? 'is-invalid'">
                        <option value="1">Chủ trọ / Quản lý</option>
                        <option value="0">Khách thuê</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{vaiTro}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent"><i class="bi bi-check-circle me-1"></i>Tạo tài khoản</button>
                    <a th:href="@{/landlord/nguoi-dung}" class="btn btn-outline-secondary" style="border-radius:8px;">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
