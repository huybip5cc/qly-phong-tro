<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Ghi nhận Sự cố</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/landlord/su-co}" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;"><i class="bi bi-arrow-left"></i></a>
        <h1 class="page-title mb-0">Ghi nhận Sự cố</h1>
    </div>
    <div class="card-box" style="max-width:580px;">
        <div class="card-box-hd">
            <h5><i class="bi bi-tools me-2" style="color:#6366f1"></i>Thông tin sự cố</h5>
        </div>
        <div class="p-4">
            <form th:action="@{/landlord/su-co/them}" th:object="${request}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label class="form-label fw-500">Phòng <span class="text-danger">*</span></label>
                    <select th:field="*{phongId}" class="form-select"
                            onchange="location.href='/landlord/su-co/them?phongId=' + this.value">
                        <option value="">-- Chọn phòng --</option>
                        <option th:each="p : ${danhSachPhong}"
                                th:value="${p.id}"
                                th:text="${p.tenToaNha + ' - Phòng ' + p.soPhong}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-500">Thiết bị liên quan</label>
                    <select th:field="*{thietBiId}" class="form-select">
                        <option value="" th:text="${#lists.isEmpty(danhSachThietBi)} ? '-- Chọn phòng trước --' : '-- Không rõ / Không có --'"></option>
                        <option th:each="tb : ${danhSachThietBi}"
                                th:value="${tb.id}"
                                th:text="${tb.tenThietBi}"></option>
                    </select>
                    <div class="form-text" th:if="${#lists.isEmpty(danhSachThietBi)}">
                        <i class="bi bi-info-circle me-1"></i>Vui lòng chọn phòng để xem danh sách thiết bị.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="moTa" class="form-label fw-500">Mô tả sự cố <span class="text-danger">*</span></label>
                    <textarea id="moTa" th:field="*{moTa}" class="form-control" rows="4"
                              th:classappend="${#fields.hasErrors('moTa')} ? 'is-invalid'"
                              placeholder="Mô tả chi tiết sự cố, vị trí, biểu hiện..."></textarea>
                    <div class="invalid-feedback" th:errors="*{moTa}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-accent"><i class="bi bi-check-circle me-1"></i>Ghi nhận</button>
                    <a th:href="@{/landlord/su-co}" class="btn btn-outline-secondary" style="border-radius:8px;">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
