<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Sự cố</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="page-title mb-0">Danh sách Sự cố</h1>
        <a th:href="@{/landlord/su-co/them}" class="btn btn-accent">
            <i class="bi bi-plus-circle me-1"></i>Ghi nhận sự cố
        </a>
    </div>
    <div class="card-box">
        <div class="card-box-hd">
            <h5><i class="bi bi-tools me-2" style="color:#6366f1"></i>Sự cố</h5>
            <small class="text-muted" th:text="${danhSach.size()} + ' sự cố'"></small>
        </div>
        <div th:if="${danhSach.isEmpty()}" class="p-5 text-center text-muted">
            <i class="bi bi-check-circle" style="font-size:3rem;opacity:.3"></i>
            <p class="mt-2">Không có sự cố nào. Tuyệt vời!</p>
        </div>
        <div class="table-responsive" th:if="${!danhSach.isEmpty()}">
            <table class="table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Phòng</th>
                        <th>Người báo</th>
                        <th>Mô tả</th>
                        <th>Thiết bị</th>
                        <th>Trạng thái</th>
                        <th>Ngày báo</th>
                        <th>Chi tiết</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item, st : ${danhSach}">
                        <td th:text="${st.count}" class="text-muted"></td>
                        <td>
                            <strong th:text="${'Phòng ' + item.soPhong}"></strong>
                            <div class="text-muted" style="font-size:.76rem" th:text="${item.tenToaNha}"></div>
                        </td>
                        <td th:text="${item.tenNguoiBao}"></td>
                        <td style="max-width:180px;">
                            <span th:text="${#strings.abbreviate(item.moTa, 60)}"></span>
                        </td>
                        <td th:text="${item.tenThietBi ?: '—'}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${item.trangThai.name() == 'MOI'} ? 'bg-moi' :
                                                 (${item.trangThai.name() == 'DANG_XU_LY'} ? 'bg-dang-xl' :
                                                 (${item.trangThai.name() == 'HOAN_THANH'} ? 'bg-da-tt' : 'bg-ngung'))"
                                  th:text="${item.trangThaiLabel}"></span>
                        </td>
                        <td th:text="${#temporals.format(item.ngayBao,'dd/MM/yyyy')}"></td>
                        <td>
                            <a th:href="@{/landlord/su-co/{id}(id=${item.id})}"
                               class="btn btn-sm btn-outline-primary" style="border-radius:7px;">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
