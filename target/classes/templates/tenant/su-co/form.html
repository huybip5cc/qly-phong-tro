<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><title>Báo sự cố</title></head>
<body>
<div th:fragment="content">
    <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/tenant/su-co}" class="btn btn-sm btn-outline-secondary" style="border-radius:8px;"><i class="bi bi-arrow-left"></i></a>
        <h1 class="page-title mb-0">Báo sự cố</h1>
    </div>
    <div class="card-box" style="max-width:540px;">
        <div class="card-box-hd"><h5><i class="bi bi-tools me-2" style="color:#6366f1"></i>Mô tả sự cố</h5></div>
        <div class="p-4">
            <div class="alert alert-info mb-3" style="border-radius:10px;font-size:.875rem;">
                <i class="bi bi-info-circle me-2"></i>
                Phòng của bạn sẽ được tự động xác định từ hợp đồng đang hiệu lực.
            </div>
            <form th:action="@{/tenant/su-co/bao}" th:object="${request}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="mb-3">
                    <label class="form-label fw-500">Thiết bị liên quan</label>
                    <select th:field="*{thietBiId}" class="form-select">
                        <option value="">-- Không rõ / Không phải thiết bị --</option>
                        <option th:each="tb : ${danhSachThietBi}"
                                th:value="${tb.id}"
                                th:text="${tb.tenThietBi}"></option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="moTa" class="form-label fw-500">Mô tả chi tiết <span class="text-danger">*</span></label>
                    <textarea id="moTa" th:field="*{moTa}" rows="5" class="form-control"
                              th:classappend="${#fields.hasErrors('moTa')} ? 'is-invalid'"
                              placeholder="Mô tả vị trí, biểu hiện sự cố để chủ trọ nắm được nhanh nhất..."></textarea>
                    <div class="invalid-feedback" th:errors="*{moTa}"></div>
                </div>
                <button type="submit" class="btn btn-accent w-100">
                    <i class="bi bi-send me-1"></i>Gửi báo cáo sự cố
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
